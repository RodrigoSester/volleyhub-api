name: Deploy API

on:
  push:
    branches:
      - development

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 'Checkout code'
      run: |
        git clone https://github.com/RodrigoSester/volleyhub-api.git
        cd volleyhub-api/
        git checkout development

    - name: Test SSH connection (optional)
      run: |
        ssh -T -o StrictHostKeyChecking=no root@46.202.151.126 "echo 'SSH connection successful'"

    - name: Copy files via rsync (recommended for efficiency)
      run: |
        rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" . root@46.202.151.126:/workspace/volleyhub/volleyhub-api

    - name: Install dependencies and start application (using SSH)
      run: |
        ssh root@46.202.151.126 << 'EOF'
          cd /workspace/volleyhub/volleyhub-api
          npm install
          pm2 restart all || pm2 start index.js
        EOF
