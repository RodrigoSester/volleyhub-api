name: Deploy API

on:
  push:
    branches:
      - development

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 'Checkout'
      description: 'Clone repository'
      run:
        using: 'composite'
        steps:
          - run: git clone https://github.com/RodrigoSester/volleyhub-api.git

    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        eval $(ssh-agent)
        ssh-add ~/.ssh/id_rsa
        ssh-keyscan -H 46.202.151.126 >> ~/.ssh/known_hosts

    - name: Copy files via SCP
      run: |
        scp -r . root@46.202.151.126:/workspace/volleyhub/volleyhub-api

    - name: Install dependencies and start application
      run: |
        ssh root@46.202.151.126 << 'EOF'
        cd /workspace/volleyhub/volleyhub-api
        npm install
        pm2 restart all || pm2 start index.js