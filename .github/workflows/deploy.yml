name: Deploy API

on:
  push:
    branches:
      - development
  workflow_dispatch: # Dispatch workflow

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 'Checkout code'
      run: |
        git clone https://github.com/RodrigoSester/volleyhub-api.git
        cd volleyhub-api/
        git checkout development

    - name: Verify SSH_PRIVATE_KEY length
      run: |
        echo "Length of SSH_PRIVATE_KEY: ${#${{ secrets.SSH_PRIVATE_KEY }}}"

    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' | sed 's/\\n/\n/g' > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        eval $(ssh-agent)
        ssh-add ~/.ssh/id_rsa
        ssh-keyscan -H 46.202.151.126 >> ~/.ssh/known_hosts

    - name: Copy files via SCP
      run: |
        scp -r repo/* root@46.202.151.126:/workspace/volleyhub/volleyhub-api

    - name: Install dependencies and start application
      run: |
        ssh root@46.202.151.126 << 'EOF'
        cd /workspace/volleyhub/volleyhub-api
        npm install
        pm2 restart all || pm2 start index.js