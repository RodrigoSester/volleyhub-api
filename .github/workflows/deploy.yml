name: Deploy API

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout code'
        run: |
          git clone https://github.com/RodrigoSester/volleyhub-api.git
          cd volleyhub-api/
          git checkout development

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" >> ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 46.202.151.126 >> ~/.ssh/known_hosts
          eval $(ssh-agent -s)
          ssh-add ~/.ssh/id_rsa

      - name: Create .env file
        run: |
          echo "DB_PORT=${{ secrets.DB_PORT }}" >> volleyhub-api/.env
          echo "DB_HOST=${{ secrets.DB_HOST }}" >> volleyhub-api/.env
          echo "DB_USER=${{ secrets.DB_USER }}" >> volleyhub-api/.env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> volleyhub-api/.env
          echo "DB_DATABASE=${{ secrets.DB_DATABASE }}" >> volleyhub-api/.env
          echo "NODE_ENV=${{ secrets.NODE_ENV }}" >> volleyhub-api/.env
          echo "PORT=${{ secrets.PORT }}" >> volleyhub-api/.env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> volleyhub-api/.env

      - name: Copy files via rsync
        run: |
          rsync -avz --delete -e ssh . github-actions@46.202.151.126:/home/github-actions/workspace/volleyhub

      - name: Install dependencies and start application (using SSH)
        run: |
          ssh github-actions@46.202.151.126 << 'EOF'
            cd workspace/volleyhub/volleyhub-api
            npm install
            npm run migrations && npm run seeds
            pm2 restart all || pm2 start index.js
          EOF